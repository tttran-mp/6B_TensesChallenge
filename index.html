<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6B Tenses Challenge</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #ff6b6b;
            --accent-color: #ffd166;
            --bg-color: #f0f7ff;
            --card-bg: #ffffff;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', 'Quicksand', 'Arial Round', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .game-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            padding: 24px;
            position: relative;
            overflow: hidden;
            border: 4px solid #e1f0ff;
        }

        /* Top Header Info */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .badge {
            background-color: #e3f2fd;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Timer Bar */
        .timer-container {
            width: 100%;
            height: 14px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background-color: var(--accent-color);
            transition: width 0.1s linear, background-color 0.3s;
        }

        /* Question Card */
        .question-card {
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 25px 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px dashed #bde0fe;
        }

        .question-text {
            font-size: 1.35rem;
            line-height: 1.6;
            color: #2b2d42;
            font-weight: 600;
        }

        .blank {
            display: inline-block;
            min-width: 90px;
            border-bottom: 3px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0 8px;
        }

        /* Options Grid (Responsive) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        @media (max-width: 500px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .btn-option {
            background-color: #ffffff;
            border: 2px solid #cdedf6;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            text-align: left;
        }

        .btn-option:hover:not(:disabled) {
            transform: translateY(-2px);
            background-color: #e8f4f8;
            border-color: var(--primary-color);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-option.correct {
            background-color: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724 !important;
        }

        .btn-option.wrong {
            background-color: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24 !important;
        }

        /* Explanation Box & Next Button */
        .explanation-box {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            display: none;
            line-height: 1.4;
        }

        .btn-next {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            display: none;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .btn-next:hover {
            background-color: #357abd;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.95);
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            border-radius: 24px;
        }

        /* Summary Modal Background (Relative Path happy.jpg) */
        .summary-modal {
            background: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.9)), url('happy.jpg') no-repeat center center;
            background-size: cover;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            max-width: 90%;
            max-height: 90%;
            overflow-y: auto;
            border: 3px solid var(--accent-color);
        }

        .modal-title {
            font-size: 1.8rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .review-list {
            text-align: left;
            margin: 15px 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .review-item {
            background-color: #f8f9fa;
            border-left: 4px solid var(--secondary-color);
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 0 8px 8px 0;
        }

        .btn-restart {
            background-color: #2ec4b6;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Top Bar -->
    <div class="header">
        <div class="badge" id="progress-text">Question: 1 / 30</div>
        <div class="badge" id="score-text">Score: 0</div>
    </div>

    <!-- Timer -->
    <div class="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
    </div>

    <!-- Question Box -->
    <div class="question-card">
        <p class="question-text" id="question-text">Loading...</p>
    </div>

    <!-- Options Grid -->
    <div class="options-grid" id="options-container">
        <!-- Buttons rendered dynamically -->
    </div>

    <!-- Explanation Box -->
    <div class="explanation-box" id="explanation-box"></div>

    <!-- Next Button -->
    <button class="btn-next" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>

    <!-- Encouragement Modal (Every 10 Questions) -->
    <div class="modal" id="encourage-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="encourage-title">🌟 Great Job!</h2>
            <p id="encourage-msg" style="font-size: 1.2rem; margin: 15px 0;">You have completed 10 questions! Keep going!</p>
            <button class="btn-restart" onclick="closeEncourageModal()">Continue Challenge 💪</button>
        </div>
    </div>

    <!-- Summary Modal (Using happy.jpg as background) -->
    <div class="modal summary-modal" id="summary-modal">
        <div class="modal-content">
            <h2 class="modal-title">🎉 Challenge Completed!</h2>
            <p style="font-size: 1.3rem; font-weight: bold;" id="final-score">Your Final Score: 0 / 30</p>
            
            <div class="review-list" id="review-suggestions">
                <!-- Revision suggestions injected dynamically -->
            </div>

            <button class="btn-restart" onclick="restartGame()">Play Again 🔄</button>
        </div>
    </div>
</div>

<script>
    // Web Audio API Sound Effects Generator
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // 30 Primary 6 English Tense Questions
    const questionBank = [
        { text: "Mum <span class='blank'></span> to work on Mondays.", options: ["works", "is working", "was working", "worked"], answer: 0, tense: "Simple Present Tense", hint: "'on Mondays' indicates a regular habit or routine. Use Simple Present Tense (singular subject 'Mum' takes verb + -s)." },
        { text: "Miss Tran <span class='blank'></span> lunch yet.", options: ["has not eaten", "has eaten", "has not ate", "had not eaten"], answer: 0, tense: "Present Perfect Tense", hint: "'yet' is a keyword for Present Perfect Tense. Structure: has/have + not + past participle (eaten)." },
        { text: "Look! The children <span class='blank'></span> in the playground.", options: ["are playing", "play", "played", "were playing"], answer: 0, tense: "Present Continuous Tense", hint: "'Look!' indicates an action happening right now. Use Present Continuous Tense (are + playing)." },
        { text: "We <span class='blank'></span> Japan two years ago.", options: ["visited", "have visited", "visit", "were visiting"], answer: 0, tense: "Simple Past Tense", hint: "'two years ago' specifies a past time. Use Simple Past Tense (visited)." },
        { text: "They <span class='blank'></span> a picnic next Sunday if it is sunny.", options: ["will have", "had", "have had", "were having"], answer: 0, tense: "Future Tense", hint: "'next Sunday' indicates a future action. Use Future Tense (will + base verb)." },
        { text: "While Mary was reading, the phone <span class='blank'></span>.", options: ["rang", "was ringing", "rings", "has rung"], answer: 0, tense: "Past Continuous Tense", hint: "'While' introduces an action in progress in the past. An interrupting action uses Simple Past Tense (rang)." },
        { text: "Peter <span class='blank'></span> his keys in the park yesterday morning.", options: ["lost", "has lost", "loses", "is losing"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday morning' refers to past time. The past tense of 'lose' is 'lost'." },
        { text: "I <span class='blank'></span> in Hong Kong since 2018.", options: ["have lived", "lived", "am living", "will live"], answer: 0, tense: "Present Perfect Tense", hint: "'since + point of time' shows an action started in the past and continues to the present. Use Present Perfect Tense (have lived)." },
        { text: "Listen! Someone <span class='blank'></span> the piano upstairs.", options: ["is playing", "plays", "played", "has played"], answer: 0, tense: "Present Continuous Tense", hint: "'Listen!' shows an action happening right now. Use Present Continuous Tense (is + playing)." },
        { text: "My father usually <span class='blank'></span> coffee in the morning.", options: ["drinks", "is drinking", "drank", "has drunk"], answer: 0, tense: "Simple Present Tense", hint: "'usually' indicates a habit. Use Simple Present Tense (drinks)." },
        { text: "What <span class='blank'></span> you doing at 8 p.m. last night?", options: ["were", "are", "have been", "did"], answer: 0, tense: "Past Continuous Tense", hint: "'at 8 p.m. last night' refers to an action in progress at a specific past time. Question form: Were you doing...?" },
        { text: "We <span class='blank'></span> the new museum tomorrow morning.", options: ["will visit", "visited", "have visited", "visit"], answer: 0, tense: "Future Tense", hint: "'tomorrow morning' indicates future time. Use Future Tense (will visit)." },
        { text: "Tom <span class='blank'></span> already finished his homework.", options: ["has", "is", "was", "did"], answer: 0, tense: "Present Perfect Tense", hint: "'already' is often used with Present Perfect Tense. For 3rd person singular 'Tom', use 'has'." },
        { text: "They <span class='blank'></span> to the beach last Saturday.", options: ["went", "go", "have gone", "are going"], answer: 0, tense: "Simple Past Tense", hint: "'last Saturday' indicates past time. The past tense of 'go' is 'went'." },
        { text: "Be quiet! The baby <span class='blank'></span> in the bedroom.", options: ["is sleeping", "sleeps", "slept", "has slept"], answer: 0, tense: "Present Continuous Tense", hint: "'Be quiet!' warns about a current situation. Use Present Continuous Tense (is sleeping)." },
        { text: "Uncle Ray <span class='blank'></span> to London next week.", options: ["will fly", "flew", "has flown", "was flying"], answer: 0, tense: "Future Tense", hint: "'next week' indicates future time. Use Future Tense (will fly)." },
        { text: "She <span class='blank'></span> TV when her friend called her.", options: ["was watching", "watched", "is watching", "has watched"], answer: 0, tense: "Past Continuous Tense", hint: "When a past continuous action (was watching) is interrupted by another past action, use Simple Past Tense (called)." },
        { text: "David never <span class='blank'></span> fast food because he prefers healthy meals.", options: ["eats", "is eating", "ate", "has eaten"], answer: 0, tense: "Simple Present Tense", hint: "'never' expresses a routine habit or general fact. Use Simple Present Tense (eats)." },
        { text: "Have you ever <span class='blank'></span> a panda in real life?", options: ["seen", "saw", "see", "seeing"], answer: 0, tense: "Present Perfect Tense", hint: "After 'Have you ever...', use Past Participle (p.p.). The p.p. of 'see' is 'seen'." },
        { text: "The rain stopped while we <span class='blank'></span> under the tree.", options: ["were waiting", "waited", "are waiting", "have waited"], answer: 0, tense: "Past Continuous Tense", hint: "After a 'while' clause, use Past Continuous Tense (were waiting)." },
        { text: "My sister <span class='blank'></span> a letter right now.", options: ["is writing", "writes", "wrote", "has written"], answer: 0, tense: "Present Continuous Tense", hint: "'right now' indicates an action happening at this moment. Use Present Continuous Tense (is writing)." },
        { text: "Mr. Chan <span class='blank'></span> English in this school for ten years.", options: ["has taught", "taught", "teaches", "is teaching"], answer: 0, tense: "Present Perfect Tense", hint: "'for + duration' indicates an action continuing from the past until now. Use Present Perfect Tense (has taught)." },
        { text: "I <span class='blank'></span> my grandfather in the hospital yesterday.", options: ["visited", "have visited", "visit", "will visit"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday' refers to a specific past time. Use Simple Past Tense (visited)." },
        { text: "We <span class='blank'></span> our final examinations next month.", options: ["will take", "took", "have taken", "were taking"], answer: 0, tense: "Future Tense", hint: "'next month' refers to future time. Use Future Tense (will take)." },
        { text: "Water <span class='blank'></span> at 100 degrees Celsius.", options: ["boils", "is boiling", "boiled", "will boil"], answer: 0, tense: "Simple Present Tense", hint: "General facts and scientific truths use Simple Present Tense (boils)." },
        { text: "The cat ran away while the dog <span class='blank'></span>.", options: ["was barking", "barked", "is barking", "has barked"], answer: 0, tense: "Past Continuous Tense", hint: "After 'while', use an action that was in progress in the past (was barking)." },
        { text: "Grandma <span class='blank'></span> her glasses. She cannot read now.", options: ["has lost", "lost", "loses", "was losing"], answer: 0, tense: "Present Perfect Tense", hint: "A past action that has a result in the present (cannot read now) uses Present Perfect Tense (has lost)." },
        { text: "Tim <span class='blank'></span> a new bicycle next Friday.", options: ["will buy", "bought", "has bought", "was buying"], answer: 0, tense: "Future Tense", hint: "'next Friday' indicates future time. Use Future Tense (will buy)." },
        { text: "The students <span class='blank'></span> noisy when the teacher arrived.", options: ["were", "are", "have been", "will be"], answer: 0, tense: "Simple Past Tense", hint: "'when the teacher arrived' describes a past situation. Use Simple Past Tense (were)." },
        { text: "Sam always <span class='blank'></span> his teeth before going to bed.", options: ["brushes", "is brushing", "brushed", "has brushed"], answer: 0, tense: "Simple Present Tense", hint: "'always' indicates a habitual action. For singular subject 'Sam', use Simple Present Tense (brushes)." }
    ];

    let currentQIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 10;
    let tenseStats = {};

    function initGame() {
        currentQIndex = 0;
        score = 0;
        tenseStats = {};
        document.getElementById("summary-modal").style.display = "none";
        document.getElementById("encourage-modal").style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questionBank[currentQIndex];

        document.getElementById("progress-text").innerText = `Question: ${currentQIndex + 1} / 30`;
        document.getElementById("score-text").innerText = `Score: ${score}`;
        document.getElementById("question-text").innerHTML = q.text;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
        optionsWithIndex.sort(() => Math.random() - 0.5);

        optionsWithIndex.forEach(optObj => {
            const btn = document.createElement("button");
            btn.className = "btn-option";
            btn.innerText = optObj.text;
            btn.onclick = () => selectAnswer(btn, optObj.isCorrect, q);
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function resetState() {
        clearInterval(timer);
        timeLeft = 10;
        updateTimerBar();
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(timer);
                handleTimeout();
            }
            updateTimerBar();
        }, 100);
    }

    function updateTimerBar() {
        const percentage = (timeLeft / 10) * 100;
        const bar = document.getElementById("timer-bar");
        bar.style.width = percentage + "%";
        if (timeLeft < 3) {
            bar.style.backgroundColor = "#ff6b6b";
        } else {
            bar.style.backgroundColor = "#ffd166";
        }
    }

    function selectAnswer(selectedBtn, isCorrect, q) {
        clearInterval(timer);
        disableOptions();

        if (isCorrect) {
            playSound('correct');
            selectedBtn.classList.add("correct");
            score++;
            document.getElementById("score-text").innerText = `Score: ${score}`;
            showNextStep();
        } else {
            playSound('wrong');
            selectedBtn.classList.add("wrong");
            recordWrongTense(q.tense);
            showExplanation(q);
            highlightCorrectOption(q);
        }
    }

    function handleTimeout() {
        disableOptions();
        playSound('wrong');
        const q = questionBank[currentQIndex];
        recordWrongTense(q.tense);
        showExplanation(q, "⏰ Time's Up!");
        highlightCorrectOption(q);
    }

    function recordWrongTense(tense) {
        tenseStats[tense] = (tenseStats[tense] || 0) + 1;
    }

    function highlightCorrectOption(q) {
        const correctText = q.options[q.answer];
        const buttons = document.querySelectorAll(".btn-option");
        buttons.forEach(btn => {
            if (btn.innerText === correctText) {
                btn.classList.add("correct");
            }
        });
    }

    function disableOptions() {
        const buttons = document.querySelectorAll(".btn-option");
        buttons.forEach(btn => btn.disabled = true);
    }

    function showExplanation(q, prefix = "") {
        const expBox = document.getElementById("explanation-box");
        expBox.innerHTML = `<strong>${prefix} Grammar Explanation (${q.tense}):</strong><br>${q.hint}`;
        expBox.style.display = "block";
        showNextStep();
    }

    function showNextStep() {
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQIndex++;
        
        if (currentQIndex === 10 || currentQIndex === 20) {
            showEncourageModal();
            return;
        }

        if (currentQIndex < questionBank.length) {
            loadQuestion();
        } else {
            showSummaryModal();
        }
    }

    function showEncourageModal() {
        const modal = document.getElementById("encourage-modal");
        const msg = document.getElementById("encourage-msg");
        if (currentQIndex === 10) {
            msg.innerText = "🌟 Great job! You have finished the first 10 questions! Keep going!";
        } else if (currentQIndex === 20) {
            msg.innerText = "🚀 Awesome! You have completed 20 questions! Final sprint time!";
        }
        modal.style.display = "flex";
    }

    function closeEncourageModal() {
        document.getElementById("encourage-modal").style.display = "none";
        loadQuestion();
    }

    function showSummaryModal() {
        const modal = document.getElementById("summary-modal");
        document.getElementById("final-score").innerText = `Your Final Score: ${score} / 30`;

        const suggestionsContainer = document.getElementById("review-suggestions");
        suggestionsContainer.innerHTML = "<strong>💡 Revision Tips for You:</strong><br>";

        const wrongTenses = Object.keys(tenseStats);
        if (wrongTenses.length === 0) {
            suggestionsContainer.innerHTML += "<div class='review-item' style='border-color:#28a745;'>Awesome! You have mastered all 6B tenses perfectly! Keep up the great work! 🏆</div>";
        } else {
            wrongTenses.forEach(tense => {
                let tip = "";
                switch(tense) {
                    case "Simple Present Tense":
                        tip = "Focus on daily habits and facts. Remember to add -s / -es for 3rd person singular subjects (He/She/It/Singular Noun).";
                        break;
                    case "Simple Past Tense":
                        tip = "Look out for past time keywords (yesterday, last week, ago) and memorize irregular past tense verbs.";
                        break;
                    case "Present Continuous Tense":
                        tip = "Watch for keywords like Look!, Listen!, and now. Structure: is / am / are + v-ing.";
                        break;
                    case "Future Tense":
                        tip = "Look for future time keywords (tomorrow, next year). Use will / be going to + base verb.";
                        break;
                    case "Present Perfect Tense":
                        tip = "Watch out for keywords like already, yet, ever, since, and for. Structure: have / has + past participle (p.p.).";
                        break;
                    case "Past Continuous Tense":
                        tip = "Remember the structure: was / were + v-ing. It is commonly used in sentence patterns with 'while' and 'when'.";
                        break;
                }
                suggestionsContainer.innerHTML += `<div class='review-item'><strong>${tense} (${tenseStats[tense]} wrong):</strong> ${tip}</div>`;
            });
        }

        modal.style.display = "flex";
    }

    function restartGame() {
        initGame();
    }

    window.onload = initGame;
</script>
</body>
</html>
