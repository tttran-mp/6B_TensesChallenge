<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6B TENSES CHALLENGE</title>
    <style>
        /* CSS 樣式 - RWD 和可愛風格設計 */
        body {
            font-family: 'Poppins', sans-serif; /* 使用可愛的字體 */
            background-color: #e0f7fa; /* 柔和的淺藍色背景 */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-areas:
                'header header'
                'main sidebar';
            gap: 20px;
        }

        /* 頂部標題區域 */
        .game-header {
            grid-area: header;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #fff9c4; /* 柔和的淺黃色標題背景 */
            border-radius: 10px;
            border: 2px dashed #ffb74d; /* 虛線邊框增加可愛感 */
        }

        .game-title {
            font-size: 2em;
            color: #e57373; /* 柔和的粉紅色標題文字 */
            margin: 0;
        }

        .game-status {
            display: flex;
            gap: 20px;
            font-weight: bold;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .icon {
            font-size: 1.2em;
        }

        /* 題目和選項區域 */
        .game-main {
            grid-area: main;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-box {
            background-color: #fce4ec; /* 柔和的淺粉色題目背景 */
            border-radius: 15px;
            padding: 20px;
            position: relative;
            border: 2px solid #f06292;
        }

        .question-text {
            font-size: 1.5em;
            margin: 0;
        }

        .pencil-icon {
            position: absolute;
            top: -15px;
            left: 20px;
            font-size: 1.5em;
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .option-button {
            border-radius: 25px;
            border: none;
            color: #fff;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 60px;
            padding: 0 10px;
        }

        .option-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* 選項按鈕顏色 */
        .option-1 { background-color: #ffb74d; }
        .option-2 { background-color: #e57373; }
        .option-3 { background-color: #fff176; color: #333; }
        .option-4 { background-color: #64b5f6; }

        .check-button {
            grid-area: main;
            justify-self: center;
            width: 150px;
            height: 50px;
            border-radius: 25px;
            background-color: #aed581; /* 柔和的淺綠色按鈕 */
            border: none;
            color: #fff;
            font-size: 1.3em;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 側邊欄計時器 */
        .game-sidebar {
            grid-area: sidebar;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background-color: #f3f3f3;
            border-radius: 15px;
            padding: 10px;
            border: 2px solid #ccc;
        }

        .timer-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid #ffb74d;
            font-size: 1.8em;
            color: #ffb74d;
        }

        .progress-section {
            width: 100%;
            text-align: center;
        }

        /* 彈窗視窗 (Modal) */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fff;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 30px;
            position: relative;
        }

        /* 總結彈窗特別設定背景圖 */
        .summary-modal .modal-content {
            background-image: url('happy.png'); /* 相對路徑使用你的圖片 */
            background-size: cover;
            background-position: center;
            color: #fff;
        }

        .summary-modal .modal-content p, .summary-modal .modal-content h2 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .modal-content h2 {
            font-size: 2.2em;
            color: #e57373;
            margin-top: 0;
        }

        .modal-content .score-text {
            font-size: 2.5em;
            margin: 10px 0;
        }

        .modal-content .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.5em;
            cursor: pointer;
            color: #ffb74d;
        }

        .replay-button, .start-game-button {
            border-radius: 25px;
            background-color: #64b5f6;
            color: #fff;
            font-size: 1.3em;
            border: none;
            padding: 10px 30px;
            cursor: pointer;
            margin-top: 20px;
        }

        /* 底部按鈕 */
        .game-footer {
            grid-area: header;
            justify-self: flex-end;
            margin-top: -10px;
            display: flex;
            gap: 15px;
        }

        .start-game-button {
            align-self: flex-end;
        }

        .sound-toggle {
            font-size: 1.2em;
            cursor: pointer;
        }

        /* RWD 響應式設計 */
        @media (max-width: 600px) {
            .game-container {
                grid-template-areas:
                    'header header'
                    'main main'
                    'sidebar sidebar';
                padding: 10px;
            }
            .game-header {
                flex-direction: column;
                gap: 10px;
            }
            .game-title {
                font-size: 1.5em;
            }
            .options-container {
                grid-template-columns: 1fr;
            }
            .timer-circle {
                width: 50px;
                height: 50px;
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">6B TENSES CHALLENGE</h1>
            <div class="game-status">
                <div class="status-item"><span class="icon">Q</span> QUESTION <span id="currentQuestionNumber">0</span> / 30</div>
                <div class="status-item"><span class="icon">★</span> SCORE: <span id="currentScore">0</span></div>
            }
        </div>

        <div class="game-sidebar">
            <div class="timer-circle" id="timerDisplay">10</div>
            <div class="progress-section">
                <p>Status</p>
                <progress id="statusProgress" value="0" max="30"></progress>
            </div>
            <div class="game-footer">
                <button class="start-game-button" id="startResetButton" onclick="startGame()">START GAME</button>
            </div>
        </div>

        <div class="game-main" id="gameArea" style="display:none;">
            <div class="question-box">
                <span class="pencil-icon">✏️</span>
                <p class="question-text" id="questionText"></p>
            </div>
            <div class="options-container" id="optionsContainer">
                <button class="option-button option-1" onclick="checkAnswer(1)"></button>
                <button class="option-button option-2" onclick="checkAnswer(2)"></button>
                <button class="option-button option-3" onclick="checkAnswer(3)"></button>
                <button class="option-button option-4" onclick="checkAnswer(4)"></button>
            </div>
            <div class="game-footer">
                <div class="sound-toggle" onclick="toggleSound()">🔊 ON</div>
            </div>
        </div>

    </div>

    <div class="modal feedback-modal" id="feedbackModal">
        <div class="modal-content">
            <span class="close-button" onclick="closeModal('feedbackModal')">×</span>
            <h2 id="feedbackTitle"></h2>
            <p id="feedbackText"></p>
        </div>
    </div>

    <div class="modal cheer-modal" id="cheerModal">
        <div class="modal-content">
            <h2>GREAT JOB!</h2>
            <p>Keep going!</p>
        </div>
    </div>

    <div class="modal summary-modal" id="summaryModal">
        <div class="modal-content">
            <h2>FINISHED!</h2>
            <p class="score-text">FINAL SCORE: <span id="finalScore">0</span>/30</p>
            <p id="revisionSuggestion"></p>
            <button class="replay-button" onclick="startGame()">REPLAY</button>
        </div>
    </div>

    <audio id="correctSound" src="correct.mp3"></audio>
    <audio id="incorrectSound" src="incorrect.mp3"></audio>

    <script>
        // JavaScript 核心邏輯

        // 題目數據池 (30題，涵蓋指定時態)
        const questions = [
            // Simple Present
            { q: "Mum ... to work on Mondays.", options: ["works", "is working", "was working", "worked"], correct: 1, explanation: "We use 'works' (Simple Present) for repeated actions on Mondays with 'Mum' (singular subject)." },
            { q: "They ... playing football in the park.", options: ["doesn't like", "don't likes", "doesn't likes", "don't like"], correct: 4, explanation: "Use 'don't' (Simple Present negative) for 'They' and the base verb 'like'." },
            { q: "Do you ... a new laptop?", options: ["has", "having", "have", "had"], correct: 3, explanation: "In questions, after 'do/does', use the base form of the verb: 'have'." },
            { q: "Water ... at 100 degrees Celsius.", options: ["is boiling", "boil", "boiled", "boils"], correct: 4, explanation: "This is a scientific fact. For facts, use Simple Present with 's' for 'Water' (singular)." },
            { q: "My father ... his car every Saturday.", options: ["was washing", "washes", "wash", "is washing"], correct: 2, explanation: "For a weekly habit, use Simple Present with 'es' for 'My father' (singular)." },

            // Simple Past
            { q: "We ... the museum last Sunday.", options: ["visited", "visits", "visit", "are visiting"], correct: 1, explanation: "For a finished action with 'last Sunday', use Simple Past: 'visited'." },
            { q: "Miss Tran... lunch yet.", options: ["has not eaten", "has eaten", "has not ate", "had not eaten"], correct: 1, explanation: "Use Present Perfect negative 'has not eaten' for 'not yet'." },
            { q: "She ... not know the answer yesterday.", options: ["did", "doesn't", "don't", "was not"], correct: 1, explanation: "In Simple Past negative, use 'did not' + base verb: 'know'." },
            { q: "Did they ... dinner yesterday evening?", options: ["had", "has", "having", "have"], correct: 4, explanation: "In Simple Past questions, use 'did' + subject + base verb: 'have'." },
            { q: "They ... in Hong Kong ten years ago.", options: ["were living", "livng", "live", "lived"], correct: 4, explanation: "For a finished state/action with 'ago', use Simple Past: 'lived'." },

            // Present Continuous
            { q: "Look! The baby ... right now.", options: ["sleeps", "is sleeping", "sleeping", "was sleeping"], correct: 2, explanation: "'Now' indicates Present Continuous: 'am/is/are' + verb-ing. For 'The baby', use 'is sleeping'." },
            { q: "Listen! They ... my favorite song.", options: ["singing", "is singing", "are singing", "sings"], correct: 3, explanation: "'Listen!' implies something is happening now. Use Present Continuous: 'are singing'." },
            { q: "I ... currently doing my homework.", options: ["is", "am", "are", "be"], correct: 2, explanation: "For Present Continuous with 'I', use 'am' + verb-ing." },
            { q: "He ... eating dinner at the moment.", options: ["is not", "not is", "not be", "is"], correct: 1, explanation: "To negate Present Continuous, use 'is not' + verb-ing." },
            { q: "Are you ... hard for the test?", options: ["studies", "studying", "study", "studied"], correct: 2, explanation: "In Present Continuous questions, use 'are' + subject + verb-ing: 'studying'." },

            // Future Tense
            { q: "I think I ... a doctor when I grow up.", options: ["will becoming", "becomes", "will become", "become"], correct: 3, explanation: "Use 'will' + base verb for a future plan or belief: 'will become'." },
            { q: "We ... to the cinema tomorrow.", options: ["go", "are go", "are going", "goes"], correct: 3, explanation: "This is a future arrangement. Present Continuous 'are going' can express future with 'tomorrow'." },
            { q: "He ... visit his grandparents next week.", options: ["will", "is", "be", "is not"], correct: 1, explanation: "Use 'will' + base verb for a future intention/prediction: 'will visit'." },
            { q: "They ... not having a party this weekend.", options: ["do", "are", "will", "is"], correct: 2, explanation: "This is a negative future arrangement. Use Present Continuous: 'are not having'." },
            { q: "Is she ... to travel next year?", options: ["going", "will", "go", "will go"], correct: 1, explanation: "This is a future intention question with 'next year'. Use 'going to' for a decided plan." },

            // Present Perfect
            { q: "She ... already finished her homework.", options: ["has", "is", "have", "was"], correct: 1, explanation: "Use 'has' + past participle 'finished' (Present Perfect) for a just completed action with 'She'." },
            { q: "I ... never ... sushi before.", options: ["have ... eat", "have ... eaten", "has ... ate", "has ... eaten"], correct: 2, explanation: "Use Present Perfect 'have eaten' for experiences with 'I'." },
            { q: "They ... not yet found their keys.", options: ["have", "did", "is", "was"], correct: 1, explanation: "Use Present Perfect negative 'have not found' for 'not yet' with 'They'." },
            { q: "Has he ... your friend before?", options: ["meet", "met", "meets", "meeting"], correct: 2, explanation: "In Present Perfect questions, use 'has' + subject + past participle: 'met'." },
            { q: "We ... lived here ... ten years.", options: ["since", "for", "during", "at"], correct: 2, explanation: "'For' specifies a duration of time (a period): 'for ten years'." },

            // Past Continuous
            { q: "He ... a sandwich when you arrived.", options: ["is eating", "ate", "eat", "was eating"], correct: 4, explanation: "For a continuous action interrupted in the past, use Past Continuous: 'was/were' + verb-ing. For 'He', use 'was eating'." },
            { q: "They ... TV while it ... raining.", options: ["was watching ... was", "was watching ... was not", "were watching ... were", "were watching ... was"], correct: 4, explanation: "Both actions were continuous in the past. For 'They' use 'were watching', for 'it' use 'was raining'." },
            { q: "While I ... sleeping, my mother ... dinner.", options: ["was ... cook", "were ... cooking", "was ... cooked", "was ... cooking"], correct: 4, explanation: "Both actions were continuous in the past. Use 'was/were' + verb-ing for both." },
            { q: "What ... they ... when the phone ...?", options: ["was ... doing ... ringed", "were ... doing ... rung", "were ... doing ... rang", "was ... doing ... rung"], correct: 3, explanation: "For a continuous action interrupted by another in the past, use 'were doing' and 'rang' (Simple Past)." },
            { q: "He ... not doing his homework when the teacher ... in.", options: ["is ... came", "was ... come", "was ... coming", "was ... came"], correct: 4, explanation: "Negative past continuous interrupted by simple past: 'was not doing' and 'came'." }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timer;
        let soundEnabled = true;
        let isAnswered = false;

        // 加油加油句子池
        const cheerSentences = [
            "Great job! 10 done, 20 more!",
            "Fantastic! 20 questions, you're almost there!",
            "Wonderful! All 30 finished!"
        ];

        // 溫習建議池
        const revisionSuggestions = [
            "Mastering tenses is key! Please review all simple present and past irregular verbs.",
            "Great work! You're almost a master. Just fine-tune your understanding of present perfect and past continuous.",
            "Excellent work! You are close to a perfect master! Review simple past irregular verbs. Try to get 30 next time!"
        ];

        // 遊戲核心邏輯

        function startGame() {
            closeModal('summaryModal');
            score = 0;
            currentQuestionIndex = 0;
            updateStatus();
            loadQuestion();
            document.getElementById('startResetButton').style.display = 'none';
            document.getElementById('gameArea').style.display = 'flex';
        }

        function loadQuestion() {
            isAnswered = false;
            const currentQuestion = questions[currentQuestionIndex];
            document.getElementById('questionText').textContent = currentQuestion.q;

            const options = currentQuestion.options;
            const optionButtons = document.querySelectorAll('.option-button');
            for (let i = 0; i < optionButtons.length; i++) {
                optionButtons[i].textContent = options[i];
                optionButtons[i].classList.remove('selected', 'correct', 'incorrect');
            }

            resetTimer();
        }

        function checkAnswer(selectedOptionIndex) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timer);

            const currentQuestion = questions[currentQuestionIndex];
            const correctOptionIndex = currentQuestion.correct;
            const optionButtons = document.querySelectorAll('.option-button');

            if (selectedOptionIndex === correctOptionIndex) {
                // 答對
                score++;
                playSound('correctSound');
                optionButtons[selectedOptionIndex - 1].classList.add('correct');
                showFeedback("Correct!", "Well done! Let's continue.");
            } else {
                // 答錯
                playSound('incorrectSound');
                optionButtons[selectedOptionIndex - 1].classList.add('incorrect');
                optionButtons[correctOptionIndex - 1].classList.add('correct');
                showFeedback("INCORRECT!", currentQuestion.explanation);
            }

            currentQuestionIndex++;
            updateStatus();

            setTimeout(() => {
                closeFeedbackModal();
                if (currentQuestionIndex < 30) {
                    // 每10題顯示加油彈窗
                    if (currentQuestionIndex === 10) showCheer(0);
                    else if (currentQuestionIndex === 20) showCheer(1);
                    else loadQuestion();
                } else {
                    showCheer(2);
                    setTimeout(showSummary, 2000); // 延遲顯示總結，讓學生看加油畫面
                }
            }, 1000); // 延遲回饋，讓學生看答案
        }

        // 計時器邏輯

        function startTimer() {
            let timeLeft = 10;
            document.getElementById('timerDisplay').textContent = timeLeft;
            document.getElementById('timerDisplay').style.color = '#ffb74d';

            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').textContent = timeLeft;

                if (timeLeft <= 3) {
                    document.getElementById('timerDisplay').style.color = '#e57373'; // 倒數3秒變紅
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timeOut();
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timer);
            document.getElementById('timerDisplay').textContent = '10';
            document.getElementById('timerDisplay').style.color = '#ffb74d';
            startTimer();
        }

        function timeOut() {
            isAnswered = true;
            playSound('incorrectSound');
            showFeedback("Time's Up!", "Be faster next time! The correct answer was: " + questions[currentQuestionIndex].options[questions[currentQuestionIndex].correct - 1]);
            currentQuestionIndex++;
            updateStatus();
            setTimeout(() => {
                closeFeedbackModal();
                if (currentQuestionIndex < 30) {
                    loadQuestion();
                } else {
                    showSummary();
                }
            }, 1000);
        }

        // 狀態和彈窗邏輯

        function updateStatus() {
            document.getElementById('currentQuestionNumber').textContent = currentQuestionIndex + 1;
            document.getElementById('currentScore').textContent = score;
            document.getElementById('statusProgress').value = currentQuestionIndex;
        }

        function showFeedback(title, text) {
            document.getElementById('feedbackTitle').textContent = title;
            document.getElementById('feedbackText').textContent = text;
            showModal('feedbackModal');
        }

        function closeFeedbackModal() {
            closeModal('feedbackModal');
        }

        function showCheer(sentenceIndex) {
            document.querySelector('#cheerModal h2').textContent = (sentenceIndex === 2) ? cheerSentences[2] : "GREAT JOB!";
            document.querySelector('#cheerModal p').textContent = (sentenceIndex === 2) ? "" : cheerSentences[sentenceIndex];
            showModal('cheerModal');
            setTimeout(() => {
                closeModal('cheerModal');
                if (currentQuestionIndex < 30) loadQuestion();
            }, 2000);
        }

        function showSummary() {
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('startResetButton').style.display = 'inline-block';
            document.getElementById('finalScore').textContent = score;

            let suggestionIndex;
            if (score <= 10) suggestionIndex = 0;
            else if (score <= 20) suggestionIndex = 1;
            else suggestionIndex = 2;
            document.getElementById('revisionSuggestion').textContent = revisionSuggestions[suggestionIndex];

            showModal('summaryModal');
        }

        function showModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 音效控制邏輯

        function playSound(soundId) {
            if (!soundEnabled) return;
            const soundElement = document.getElementById(soundId);
            soundElement.currentTime = 0;
            soundElement.play();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.querySelector('.sound-toggle').textContent = soundEnabled ? "🔊 ON" : "🔇 OFF";
        }
    </script>
</body>
</html>
