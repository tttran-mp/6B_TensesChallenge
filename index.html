<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6B Tenses Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #2A60A0;
            --secondary: #FF6B81;
            --accent: #FFD166;
            --accent-dark: #E0A800;
            --success: #2ECC71;
            --success-dark: #27AE60;
            --danger: #FF4757;
            --danger-dark: #C0392B;
            --bg-pattern: #EBF5FF;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#BEE3F8 15%, transparent 16%), radial-gradient(#BEE3F8 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: clamp(10px, 3vw, 20px);
        }

        .game-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 32px;
            border: 6px solid #BEE3F8;
            box-shadow: 0 12px 0 #90CDF4, 0 20px 30px rgba(0, 0, 0, 0.1);
            padding: clamp(16px, 4vw, 28px);
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill-badge {
            background: #EDF2F7;
            border: 3px solid #CBD5E0;
            color: var(--primary-dark);
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
            box-shadow: 0 4px 0 #CBD5E0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .score-badge {
            background: #FEFCBF;
            border-color: #F6E05E;
            color: #744210;
            box-shadow: 0 4px 0 #F6E05E;
        }

        .bgm-btn {
            background: #E2E8F0;
            border: 3px solid #CBD5E0;
            color: #4A5568;
            cursor: pointer;
            transition: all 0.2s;
        }

        .bgm-btn.active {
            background: #C6F6D5;
            border-color: #68D391;
            color: #22543D;
            box-shadow: 0 4px 0 #68D391;
        }

        .timer-outer {
            width: 100%;
            height: 16px;
            background: #E2E8F0;
            border-radius: 50px;
            border: 3px solid #CBD5E0;
            overflow: hidden;
            margin-bottom: 18px;
        }

        .timer-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #FFD166, #FF6B81);
            border-radius: 50px;
            transition: width 0.1s linear, background 0.3s;
        }

        .question-box {
            background: #F7FAFC;
            border: 4px dashed #90CDF4;
            border-radius: 24px;
            padding: clamp(18px, 4vw, 28px) clamp(12px, 3vw, 20px);
            margin-bottom: 18px;
            text-align: center;
            min-height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-text {
            font-size: clamp(1.1rem, 3.6vw, 1.4rem);
            line-height: 1.6;
            color: #2D3436;
            font-weight: 600;
        }

        .blank-space {
            display: inline-block;
            min-width: 80px;
            border-bottom: 4px solid var(--primary);
            color: var(--primary);
            padding: 0 8px;
            font-weight: 700;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-radius: 20px;
            padding: clamp(12px, 2.5vw, 15px) 16px;
            font-size: clamp(0.95rem, 2.8vw, 1.1rem);
            font-weight: 600;
            color: #4A5568;
            cursor: pointer;
            box-shadow: 0 5px 0 #CBD5E0;
            transition: all 0.15s ease;
            text-align: left;
            word-break: break-word;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 7px 0 #90CDF4;
            color: var(--primary-dark);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #CBD5E0;
        }

        .option-btn.correct {
            background: #D4EDDA !important;
            border-color: var(--success) !important;
            color: #155724 !important;
            box-shadow: 0 5px 0 var(--success-dark) !important;
        }

        .option-btn.wrong {
            background: #F8D7DA !important;
            border-color: var(--danger) !important;
            color: #721C24 !important;
            box-shadow: 0 5px 0 var(--danger-dark) !important;
        }

        .explanation-card {
            background: #FFFBEB;
            border: 3px solid #FCD34D;
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 15px;
            font-size: clamp(0.88rem, 2.5vw, 1rem);
            color: #92400E;
            line-height: 1.5;
            display: none;
            box-shadow: 0 4px 0 #FDE68A;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 28px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 var(--primary-dark);
            transition: all 0.15s ease;
            display: none;
        }

        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.96);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            border-radius: 26px;
        }

        .summary-modal {
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.92)), url('happy.png') no-repeat center center;
            background-size: cover;
        }

        .modal-content-box {
            background: #FFFFFF;
            border: 5px solid var(--accent);
            border-radius: 26px;
            padding: clamp(18px, 4vw, 28px);
            box-shadow: 0 10px 0 var(--accent-dark), 0 15px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: clamp(1.4rem, 4.5vw, 1.8rem);
            color: var(--primary);
            margin-bottom: 10px;
        }

        .review-container {
            text-align: left;
            margin: 14px 0;
            font-size: clamp(0.85rem, 2.4vw, 0.95rem);
        }

        .review-card {
            background: #F7FAFC;
            border-left: 5px solid var(--secondary);
            padding: 8px 12px;
            margin-bottom: 8px;
            border-radius: 0 10px 10px 0;
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn-restart, .btn-export {
            border: none;
            border-radius: 50px;
            padding: 10px 24px;
            font-size: clamp(1rem, 2.8vw, 1.15rem);
            font-weight: 700;
            cursor: pointer;
            color: white;
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
        }

        .btn-restart {
            background: var(--success);
            box-shadow: 0 5px 0 var(--success-dark);
        }

        .btn-export {
            background: var(--primary);
            box-shadow: 0 5px 0 var(--primary-dark);
        }

        .btn-restart:active, .btn-export:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        }

        @media (max-width: 480px) {
            .options-grid { grid-template-columns: 1fr; }
            .game-card { padding: 14px 10px; }
        }
    </style>
</head>
<body>

<div class="game-card">
    <div class="top-bar">
        <div class="pill-badge" id="progress-text">🎯 1 / 30</div>
        <button class="pill-badge bgm-btn" id="bgm-btn" onclick="toggleBGM()">🎵 BGM: OFF</button>
        <div class="pill-badge score-badge" id="score-text">⭐ 0</div>
    </div>

    <div class="timer-outer">
        <div class="timer-inner" id="timer-bar"></div>
    </div>

    <div class="question-box">
        <p class="question-text" id="question-text">Loading...</p>
    </div>

    <div class="options-grid" id="options-container"></div>

    <div class="explanation-card" id="explanation-box"></div>

    <button class="action-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>

    <div class="modal-overlay" id="encourage-modal">
        <div class="modal-content-box">
            <h2 class="modal-title" id="encourage-title">🌟 Great Job!</h2>
            <p id="encourage-msg" style="font-size: clamp(0.95rem, 2.8vw, 1.1rem); margin: 15px 0; color: #4A5568;">
                Keep going! You are doing awesome!
            </p>
            <button class="btn-restart" onclick="closeEncourageModal()">Continue Challenge 💪</button>
        </div>
    </div>

    <div class="modal-overlay summary-modal" id="summary-modal">
        <div class="modal-content-box">
            <h2 class="modal-title">🎉 Challenge Complete!</h2>
            <p style="font-size: clamp(1.1rem, 3.2vw, 1.35rem); font-weight: 700; color: #2D3436;" id="final-score">
                Your Score: 0 / 30
            </p>
            
            <div class="review-container" id="review-suggestions"></div>

            <div class="modal-btn-group">
                <button class="btn-export" onclick="exportReport()">📄 Download Report</button>
                <button class="btn-restart" onclick="restartGame()">Play Again 🔄</button>
            </div>
        </div>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgmOn = false;
    let bgmTimer = null;
    const bgmNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66];
    let noteIndex = 0;

    function toggleBGM() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        bgmOn = !bgmOn;
        const btn = document.getElementById("bgm-btn");
        if (bgmOn) {
            btn.innerText = "🎵 BGM: ON";
            btn.classList.add("active");
            startBGM();
        } else {
            btn.innerText = "🔇 BGM: OFF";
            btn.classList.remove("active");
            stopBGM();
        }
    }

    function startBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
        bgmTimer = setInterval(() => {
            if (!bgmOn) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(bgmNotes[noteIndex], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.025, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
            noteIndex = (noteIndex + 1) % bgmNotes.length;
        }, 380);
    }

    function stopBGM() {
        if (bgmTimer) clearInterval(bgmTimer);
    }

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    const masterQuestionBank = [
        // --- 1. Simple Present Tense ---
        { text: "Mum <span class='blank-space'></span> to work on Mondays.", options: ["works", "is working", "was working", "worked"], answer: 0, tense: "Simple Present Tense", hint: "'on Mondays' indicates a regular habit. Use Simple Present Tense." },
        { text: "My father usually <span class='blank-space'></span> coffee in the morning.", options: ["drinks", "is drinking", "drank", "has drunk"], answer: 0, tense: "Simple Present Tense", hint: "'usually' expresses a habit (drinks)." },
        { text: "David never <span class='blank-space'></span> fast food because he prefers healthy meals.", options: ["eats", "is eating", "ate", "has eaten"], answer: 0, tense: "Simple Present Tense", hint: "'never' states a general truth or habit (eats)." },
        { text: "Water <span class='blank-space'></span> at 100 degrees Celsius.", options: ["boils", "is boiling", "boiled", "will boil"], answer: 0, tense: "Simple Present Tense", hint: "Scientific facts use Simple Present Tense (boils)." },
        { text: "Sam always <span class='blank-space'></span> his teeth before going to bed.", options: ["brushes", "is brushing", "brushed", "has brushed"], answer: 0, tense: "Simple Present Tense", hint: "'always' specifies a daily habit (brushes)." },
        { text: "The Sun <span class='blank-space'></span> in the East.", options: ["rises", "is rising", "rose", "has risen"], answer: 0, tense: "Simple Present Tense", hint: "Universal truth uses Simple Present Tense (rises)." },
        { text: "Dogs <span class='blank-space'></span> loudly when they see strangers.", options: ["bark", "are barking", "barked", "have barked"], answer: 0, tense: "Simple Present Tense", hint: "General behavior of animals takes Simple Present Tense." },
        { text: "She <span class='blank-space'></span> the school bus at 7:00 a.m. every day.", options: ["catches", "is catching", "caught", "has caught"], answer: 0, tense: "Simple Present Tense", hint: "'every day' signals a routine (catches)." },
        { text: "My uncle <span class='blank-space'></span> in Canada.", options: ["lives", "is living", "lived", "was living"], answer: 0, tense: "Simple Present Tense", hint: "Stating a permanent situation (lives)." },
        { text: "The library <span class='blank-space'></span> at 9:00 a.m. on Saturdays.", options: ["opens", "is opening", "opened", "has opened"], answer: 0, tense: "Simple Present Tense", hint: "Timetables and schedules use Simple Present Tense." },
        { text: "Earth <span class='blank-space'></span> around the Sun.", options: ["goes", "is going", "went", "has gone"], answer: 0, tense: "Simple Present Tense", hint: "A general fact takes Simple Present Tense (goes)." },
        { text: "He rarely <span class='blank-space'></span> sugary soda.", options: ["drinks", "is drinking", "drank", "has drunk"], answer: 0, tense: "Simple Present Tense", hint: "'rarely' specifies frequency of a habit (drinks)." },
        { text: "Nurses <span class='blank-space'></span> after patients in hospitals.", options: ["look", "are looking", "looked", "have looked"], answer: 0, tense: "Simple Present Tense", hint: "General job responsibility takes Simple Present Tense." },
        { text: "Tim's brother <span class='blank-space'></span> the violin very well.", options: ["plays", "is playing", "played", "has played"], answer: 0, tense: "Simple Present Tense", hint: "Stating an ability or skill uses Simple Present Tense." },
        { text: "Do you <span class='blank-space'></span> spicy food?", options: ["like", "likes", "liking", "liked"], answer: 0, tense: "Simple Present Tense", hint: "Questions with 'Do' take base verb (like)." },
        { text: "Mr. Lee <span class='blank-space'></span> science in our school.", options: ["teaches", "is teaching", "taught", "has taught"], answer: 0, tense: "Simple Present Tense", hint: "General truths or current jobs take Simple Present Tense." },

        // --- 2. Present Continuous Tense ---
        { text: "Look! The children <span class='blank-space'></span> in the playground.", options: ["are playing", "play", "played", "were playing"], answer: 0, tense: "Present Continuous Tense", hint: "'Look!' shows an action taking place now." },
        { text: "Listen! Someone <span class='blank-space'></span> the piano upstairs.", options: ["is playing", "plays", "played", "has played"], answer: 0, tense: "Present Continuous Tense", hint: "'Listen!' signals an action happening right now." },
        { text: "Be quiet! The baby <span class='blank-space'></span> in the bedroom.", options: ["is sleeping", "sleeps", "slept", "has slept"], answer: 0, tense: "Present Continuous Tense", hint: "'Be quiet!' warns about an action happening now." },
        { text: "My sister <span class='blank-space'></span> a letter right now.", options: ["is writing", "writes", "wrote", "has written"], answer: 0, tense: "Present Continuous Tense", hint: "'right now' shows action happening at this moment." },
        { text: "Look at those kids! They <span class='blank-space'></span> across the street.", options: ["are running", "run", "ran", "have run"], answer: 0, tense: "Present Continuous Tense", hint: "'Look at...' signals an ongoing current action." },
        { text: "Shh! The principal <span class='blank-space'></span> on stage.", options: ["is speaking", "speaks", "spoke", "has spoken"], answer: 0, tense: "Present Continuous Tense", hint: "'Shh!' indicates a current happening." },
        { text: "Right now, my mother <span class='blank-space'></span> dinner in the kitchen.", options: ["is cooking", "cooks", "cooked", "was cooking"], answer: 0, tense: "Present Continuous Tense", hint: "'Right now' uses Present Continuous Tense." },
        { text: "We <span class='blank-space'></span> a party at the moment.", options: ["are having", "have", "had", "were having"], answer: 0, tense: "Present Continuous Tense", hint: "'at the moment' indicates present action in progress." },
        { text: "Listen! The birds <span class='blank-space'></span> in the tree.", options: ["are singing", "sing", "sang", "were singing"], answer: 0, tense: "Present Continuous Tense", hint: "'Listen!' points to action happening now." },
        { text: "They <span class='blank-space'></span> a new shopping mall near my home now.", options: ["are building", "build", "built", "have built"], answer: 0, tense: "Present Continuous Tense", hint: "'now' specifies present continuous action." },
        { text: "Why <span class='blank-space'></span> you crying, little boy?", options: ["are", "do", "did", "were"], answer: 0, tense: "Present Continuous Tense", hint: "'Why are you + v-ing?' is the question structure." },
        { text: "Look! The bus <span class='blank-space'></span> fast!", options: ["is coming", "comes", "came", "has come"], answer: 0, tense: "Present Continuous Tense", hint: "'Look!' demands attention to ongoing action." },
        { text: "My father <span class='blank-space'></span> his car at this moment.", options: ["is repairing", "repairs", "repaired", "has repaired"], answer: 0, tense: "Present Continuous Tense", hint: "'at this moment' signals Present Continuous Tense." },
        { text: "The teacher <span class='blank-space'></span> on the whiteboard now.", options: ["is writing", "writes", "wrote", "was writing"], answer: 0, tense: "Present Continuous Tense", hint: "'now' indicates Present Continuous Tense." },
        { text: "Hurry up! Everyone <span class='blank-space'></span> for you.", options: ["is waiting", "waits", "waited", "has waited"], answer: 0, tense: "Present Continuous Tense", hint: "Urgency signals continuous action right now." },
        { text: "I <span class='blank-space'></span> a very interesting storybook now.", options: ["am reading", "read", "have read", "was reading"], answer: 0, tense: "Present Continuous Tense", hint: "Subject 'I' takes 'am + v-ing' (am reading)." },

        // --- 3. Simple Past Tense ---
        { text: "We <span class='blank-space'></span> Japan two years ago.", options: ["visited", "have visited", "visit", "were visiting"], answer: 0, tense: "Simple Past Tense", hint: "'two years ago' specifies a finished past time." },
        { text: "Peter <span class='blank-space'></span> his keys in the park yesterday morning.", options: ["lost", "has lost", "loses", "is losing"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday morning' refers to past time. Use 'lost'." },
        { text: "They <span class='blank-space'></span> to the beach last Saturday.", options: ["went", "go", "have gone", "are going"], answer: 0, tense: "Simple Past Tense", hint: "'last Saturday' specifies past time. Use 'went'." },
        { text: "I <span class='blank-space'></span> my grandfather in the hospital yesterday.", options: ["visited", "have visited", "visit", "will visit"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday' indicates past time (visited)." },
        { text: "The students <span class='blank-space'></span> noisy when the teacher arrived.", options: ["were", "are", "have been", "will be"], answer: 0, tense: "Simple Past Tense", hint: "'when the teacher arrived' describes a past state." },
        { text: "I <span class='blank-space'></span> a cool Lego set last night.", options: ["bought", "buy", "have bought", "was buying"], answer: 0, tense: "Simple Past Tense", hint: "'last night' indicates past time. Past of buy is 'bought'." },
        { text: "She <span class='blank-space'></span> her leg while ice-skating last winter.", options: ["broke", "breaks", "has broken", "was breaking"], answer: 0, tense: "Simple Past Tense", hint: "'last winter' refers to finished past time." },
        { text: "We <span class='blank-space'></span> hotpot for dinner yesterday.", options: ["ate", "eat", "have eaten", "are eating"], answer: 0, tense: "Simple Past Tense", hint: "Past tense of 'eat' is 'ate'." },
        { text: "Mr. Wong <span class='blank-space'></span> us maths three years ago.", options: ["taught", "teaches", "has taught", "was teaching"], answer: 0, tense: "Simple Past Tense", hint: "'three years ago' signals Simple Past Tense." },
        { text: "My family <span class='blank-space'></span> to Kowloon last month.", options: ["moved", "moves", "has moved", "is moving"], answer: 0, tense: "Simple Past Tense", hint: "'last month' specifies finished past time." },
        { text: "Did you <span class='blank-space'></span> the fireworks last night?", options: ["see", "saw", "seen", "seeing"], answer: 0, tense: "Simple Past Tense", hint: "Questions starting with 'Did' take base verb (see)." },
        { text: "He <span class='blank-space'></span> a letter to his teacher yesterday.", options: ["wrote", "writes", "has written", "was writing"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday' takes Simple Past Tense (wrote)." },
        { text: "I <span class='blank-space'></span> a bad cold last week.", options: ["caught", "catch", "have caught", "was catching"], answer: 0, tense: "Simple Past Tense", hint: "Past tense of 'catch' is 'caught'." },
        { text: "They <span class='blank-space'></span> the football match yesterday afternoon.", options: ["won", "win", "have won", "are winning"], answer: 0, tense: "Simple Past Tense", hint: "Past tense of 'win' is 'won'." },
        { text: "She <span class='blank-space'></span> a lost wallet in the school playground this morning.", options: ["found", "finds", "has found", "was finding"], answer: 0, tense: "Simple Past Tense", hint: "Past tense of 'find' is 'found'." },
        { text: "We <span class='blank-space'></span> early last night because we were tired.", options: ["slept", "sleep", "have slept", "are sleeping"], answer: 0, tense: "Simple Past Tense", hint: "Past tense of 'sleep' is 'slept'." },
        { text: "My dog <span class='blank-space'></span> loudly at the mailman yesterday.", options: ["barked", "barks", "has barked", "was barking"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday' requires Simple Past Tense (barked)." },

        // --- 4. Past Continuous Tense ---
        { text: "While Mary was reading, the phone <span class='blank-space'></span>.", options: ["rang", "was ringing", "rings", "has rung"], answer: 0, tense: "Past Continuous Tense", hint: "An interrupting action takes Simple Past Tense (rang)." },
        { text: "What <span class='blank-space'></span> you doing at 8 p.m. last night?", options: ["were", "are", "have been", "did"], answer: 0, tense: "Past Continuous Tense", hint: "Asking about continuous action in past: 'Were you doing...?'" },
        { text: "She <span class='blank-space'></span> TV when her friend called her.", options: ["was watching", "watched", "is watching", "has watched"], answer: 0, tense: "Past Continuous Tense", hint: "Action in progress interrupted by another past action." },
        { text: "The rain stopped while we <span class='blank-space'></span> under the tree.", options: ["were waiting", "waited", "are waiting", "have waited"], answer: 0, tense: "Past Continuous Tense", hint: "After 'while', use Past Continuous Tense (were waiting)." },
        { text: "The cat ran away while the dog <span class='blank-space'></span>.", options: ["was barking", "barked", "is barking", "has barked"], answer: 0, tense: "Past Continuous Tense", hint: "Use Past Continuous Tense after 'while' (was barking)." },
        { text: "We <span class='blank-space'></span> a movie when the power went out.", options: ["were watching", "watched", "are watching", "have watched"], answer: 0, tense: "Past Continuous Tense", hint: "Action in progress interrupted by past action." },
        { text: "They <span class='blank-space'></span> dinner at 7 p.m. yesterday.", options: ["were having", "have had", "are having", "will have"], answer: 0, tense: "Past Continuous Tense", hint: "Action in progress at specific past time." },
        { text: "What <span class='blank-space'></span> they discussing when I walked in?", options: ["were", "are", "did", "have"], answer: 0, tense: "Past Continuous Tense", hint: "Question form for past continuous: 'Were they + v-ing'." },
        { text: "I <span class='blank-space'></span> my homework while my brother was playing games.", options: ["was doing", "did", "am doing", "have done"], answer: 0, tense: "Past Continuous Tense", hint: "Two simultaneous past actions both take Past Continuous Tense." },
        { text: "The wind <span class='blank-space'></span> hard when we left the house.", options: ["was blowing", "blew", "is blowing", "has blown"], answer: 0, tense: "Past Continuous Tense", hint: "Background action in progress in the past (was blowing)." },
        { text: "While I <span class='blank-space'></span> home, it started to rain.", options: ["was walking", "walked", "am walking", "have walked"], answer: 0, tense: "Past Continuous Tense", hint: "Use Past Continuous Tense after 'while' (was walking)." },
        { text: "She dropped her plate while she <span class='blank-space'></span> the dishes.", options: ["was washing", "washed", "is washing", "has washed"], answer: 0, tense: "Past Continuous Tense", hint: "'while' indicates an ongoing action in the past." },
        { text: "<span class='blank-space'></span> you sleeping when I called you last night?", options: ["Were", "Are", "Did", "Have"], answer: 0, tense: "Past Continuous Tense", hint: "Past continuous question with 'you' takes 'Were'." },
        { text: "They <span class='blank-space'></span> the wall when I saw them.", options: ["were painting", "painted", "are painting", "have painted"], answer: 0, tense: "Past Continuous Tense", hint: "Ongoing action at the moment of seeing." },
        { text: "He fell asleep while he <span class='blank-space'></span> for the test.", options: ["was studying", "studied", "is studying", "has studied"], answer: 0, tense: "Past Continuous Tense", hint: "Use Past Continuous Tense after 'while'." },
        { text: "The birds <span class='blank-space'></span> loudly all morning yesterday.", options: ["were chirping", "chirp", "are chirping", "have chirped"], answer: 0, tense: "Past Continuous Tense", hint: "'all morning yesterday' emphasizes continuous past duration." },

        // --- 5. Future Tense ---
        { text: "They <span class='blank-space'></span> a picnic next Sunday if it is sunny.", options: ["will have", "had", "have had", "were having"], answer: 0, tense: "Future Tense", hint: "'next Sunday' signals a future plan (will + base verb)." },
        { text: "We <span class='blank-space'></span> the new museum tomorrow morning.", options: ["will visit", "visited", "have visited", "visit"], answer: 0, tense: "Future Tense", hint: "'tomorrow morning' indicates future time (will visit)." },
        { text: "Uncle Ray <span class='blank-space'></span> to London next week.", options: ["will fly", "flew", "has flown", "was flying"], answer: 0, tense: "Future Tense", hint: "'next week' refers to future time (will fly)." },
        { text: "We <span class='blank-space'></span> our final examinations next month.", options: ["will take", "took", "have taken", "were taking"], answer: 0, tense: "Future Tense", hint: "'next month' indicates future time (will take)." },
        { text: "Tim <span class='blank-space'></span> a new bicycle next Friday.", options: ["will buy", "bought", "has bought", "was buying"], answer: 0, tense: "Future Tense", hint: "'next Friday' specifies future time (will buy)." },
        { text: "Look at those clouds! It <span class='blank-space'></span> rain soon.", options: ["will", "is", "was", "has"], answer: 0, tense: "Future Tense", hint: "Expressing future prediction (will rain)." },
        { text: "I <span class='blank-space'></span> you as soon as I arrive home tomorrow.", options: ["will call", "called", "have called", "was calling"], answer: 0, tense: "Future Tense", hint: "'tomorrow' indicates Future Tense (will call)." },
        { text: "She <span class='blank-space'></span> 12 years old next month.", options: ["will be", "is", "was", "has been"], answer: 0, tense: "Future Tense", hint: "Future fact uses Future Tense (will be)." },
        { text: "The school concert <span class='blank-space'></span> at 7 p.m. tomorrow night.", options: ["will start", "started", "has started", "was starting"], answer: 0, tense: "Future Tense", hint: "'tomorrow night' signals Future Tense (will start)." },
        { text: "We <span class='blank-space'></span> to Taiwan this coming summer.", options: ["are going to travel", "traveled", "have traveled", "were traveling"], answer: 0, tense: "Future Tense", hint: "'be going to + verb' expresses future plans." },
        { text: "<span class='blank-space'></span> you join our basketball club next term?", options: ["Will", "Did", "Have", "Were"], answer: 0, tense: "Future Tense", hint: "Future question starts with 'Will'." },
        { text: "My parents <span class='blank-space'></span> a new garden house next year.", options: ["will build", "built", "have built", "were building"], answer: 0, tense: "Future Tense", hint: "'next year' indicates future time (will build)." },
        { text: "He promises he <span class='blank-space'></span> harder in the future.", options: ["will work", "worked", "has worked", "was working"], answer: 0, tense: "Future Tense", hint: "A promise about the future uses 'will + verb'." },
        { text: "I <span class='blank-space'></span> you my comic book tomorrow.", options: ["will lend", "lent", "have lent", "was lending"], answer: 0, tense: "Future Tense", hint: "'tomorrow' indicates Future Tense (will lend)." },
        { text: "They <span class='blank-space'></span> a charity bazaar next Saturday.", options: ["will hold", "held", "have held", "were holding"], answer: 0, tense: "Future Tense", hint: "'next Saturday' indicates future time (will hold)." },
        { text: "She is going to <span class='blank-space'></span> French next year.", options: ["learn", "learned", "learning", "learns"], answer: 0, tense: "Future Tense", hint: "After 'be going to', use base verb (learn)." },
        { text: "We <span class='blank-space'></span> Grandfather's 80th birthday next week.", options: ["will celebrate", "celebrated", "have celebrated", "were celebrating"], answer: 0, tense: "Future Tense", hint: "'next week' signals Future Tense (will celebrate)." },

        // --- 6. Present Perfect Tense ---
        { text: "Miss Tran <span class='blank-space'></span> lunch yet.", options: ["has not eaten", "has eaten", "has not ate", "had not eaten"], answer: 0, tense: "Present Perfect Tense", hint: "'yet' signals Present Perfect Tense (has/have + not + p.p.)." },
        { text: "I <span class='blank-space'></span> in Hong Kong since 2018.", options: ["have lived", "lived", "am living", "will live"], answer: 0, tense: "Present Perfect Tense", hint: "'since + time' shows action continuing to present (have lived)." },
        { text: "Tom <span class='blank-space'></span> already finished his homework.", options: ["has", "is", "was", "did"], answer: 0, tense: "Present Perfect Tense", hint: "'already' pairs with Present Perfect Tense (has finished)." },
        { text: "Have you ever <span class='blank-space'></span> a panda in real life?", options: ["seen", "saw", "see", "seeing"], answer: 0, tense: "Present Perfect Tense", hint: "'Have you ever...' takes Past Participle (seen)." },
        { text: "Mr. Chan <span class='blank-space'></span> English in this school for ten years.", options: ["has taught", "taught", "teaches", "is teaching"], answer: 0, tense: "Present Perfect Tense", hint: "'for + period' shows action continuing to present (has taught)." },
        { text: "Grandma <span class='blank-space'></span> her glasses. She cannot read now.", options: ["has lost", "lost", "loses", "was losing"], answer: 0, tense: "Present Perfect Tense", hint: "Past event with a present result (cannot read now)." },
        { text: "I <span class='blank-space'></span> my room already. Can I play now?", options: ["have cleaned", "cleaned", "clean", "was cleaning"], answer: 0, tense: "Present Perfect Tense", hint: "'already' indicates Present Perfect Tense." },
        { text: "Have you <span class='blank-space'></span> reading this library book yet?", options: ["finished", "finish", "finishing", "finishes"], answer: 0, tense: "Present Perfect Tense", hint: "'Have you + p.p. ... yet?' form." },
        { text: "My brother has just <span class='blank-space'></span> his driving test.", options: ["passed", "pass", "passing", "passes"], answer: 0, tense: "Present Perfect Tense", hint: "'has just' is followed by Past Participle (passed)." },
        { text: "We <span class='blank-space'></span> in this flat for five years.", options: ["have lived", "lived", "are living", "will live"], answer: 0, tense: "Present Perfect Tense", hint: "'for + time period' takes Present Perfect Tense." },
        { text: "She has never <span class='blank-space'></span> Disneyland before.", options: ["visited", "visit", "visiting", "visits"], answer: 0, tense: "Present Perfect Tense", hint: "'has never' is followed by Past Participle (visited)." },
        { text: "He <span class='blank-space'></span> his wallet, so he cannot pay for lunch.", options: ["has lost", "lost", "loses", "is losing"], answer: 0, tense: "Present Perfect Tense", hint: "Past action with present consequence uses Present Perfect Tense." },
        { text: "They have already <span class='blank-space'></span> all the washing-up.", options: ["done", "did", "do", "doing"], answer: 0, tense: "Present Perfect Tense", hint: "'have already' takes Past Participle (done)." },
        { text: "How long <span class='blank-space'></span> you known your best friend?", options: ["have", "did", "are", "were"], answer: 0, tense: "Present Perfect Tense", hint: "'How long have you + p.p.?' asks about duration to present." },
        { text: "Lucy <span class='blank-space'></span> in London since she was born.", options: ["has lived", "lived", "is living", "was living"], answer: 0, tense: "Present Perfect Tense", hint: "'since' indicates Present Perfect Tense." },
        { text: "I have not <span class='blank-space'></span> any reply from him yet.", options: ["received", "receive", "receiving", "receives"], answer: 0, tense: "Present Perfect Tense", hint: "'have not' is followed by Past Participle (received)." },
        { text: "The teacher has just <span class='blank-space'></span> our exercise books.", options: ["checked", "check", "checking", "checks"], answer: 0, tense: "Present Perfect Tense", hint: "'has just' takes Past Participle (checked)." }
    ];

    let currentSessionQuestions = [];
    let currentQIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 10;
    let tenseStats = {};

    function initGame() {
        currentQIndex = 0;
        score = 0;
        tenseStats = {};
        currentSessionQuestions = [...masterQuestionBank].sort(() => Math.random() - 0.5).slice(0, 30);
        
        document.getElementById("summary-modal").style.display = "none";
        document.getElementById("encourage-modal").style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = currentSessionQuestions[currentQIndex];

        document.getElementById("progress-text").innerText = `🎯 ${currentQIndex + 1} / 30`;
        document.getElementById("score-text").innerText = `⭐ ${score}`;
        document.getElementById("question-text").innerHTML = q.text;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
        optionsWithIndex.sort(() => Math.random() - 0.5);

        optionsWithIndex.forEach(optObj => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optObj.text;
            btn.onclick = () => selectAnswer(btn, optObj.isCorrect, q);
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function resetState() {
        clearInterval(timer);
        timeLeft = 10;
        updateTimerBar();
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(timer);
                handleTimeout();
            }
            updateTimerBar();
        }, 100);
    }

    function updateTimerBar() {
        const percentage = (timeLeft / 10) * 100;
        const bar = document.getElementById("timer-bar");
        bar.style.width = percentage + "%";
        if (timeLeft < 3) {
            bar.style.background = "#FF4757";
        } else {
            bar.style.background = "linear-gradient(90deg, #FFD166, #FF6B81)";
        }
    }

    function selectAnswer(selectedBtn, isCorrect, q) {
        clearInterval(timer);
        disableOptions();

        if (isCorrect) {
            playSound('correct');
            selectedBtn.classList.add("correct");
            score++;
            document.getElementById("score-text").innerText = `⭐ ${score}`;
            showNextStep();
        } else {
            playSound('wrong');
            selectedBtn.classList.add("wrong");
            recordWrongTense(q.tense);
            showExplanation(q);
            highlightCorrectOption(q);
        }
    }

    function handleTimeout() {
        disableOptions();
        playSound('wrong');
        const q = currentSessionQuestions[currentQIndex];
        recordWrongTense(q.tense);
        showExplanation(q, "⏰ Time's Up!");
        highlightCorrectOption(q);
    }

    function recordWrongTense(tense) {
        tenseStats[tense] = (tenseStats[tense] || 0) + 1;
    }

    function highlightCorrectOption(q) {
        const correctText = q.options[q.answer];
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => {
            if (btn.innerText === correctText) {
                btn.classList.add("correct");
            }
        });
    }

    function disableOptions() {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
    }

    function showExplanation(q, prefix = "") {
        const expBox = document.getElementById("explanation-box");
        expBox.innerHTML = `<strong>${prefix} Grammar Tip (${q.tense}):</strong><br>${q.hint}`;
        expBox.style.display = "block";
        showNextStep();
    }

    function showNextStep() {
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQIndex++;
        
        if (currentQIndex === 10 || currentQIndex === 20) {
            showEncourageModal();
            return;
        }

        if (currentQIndex < currentSessionQuestions.length) {
            loadQuestion();
        } else {
            showSummaryModal();
        }
    }

    function showEncourageModal() {
        const modal = document.getElementById("encourage-modal");
        const msg = document.getElementById("encourage-msg");
        if (currentQIndex === 10) {
            msg.innerText = "🌟 Fantastic! First 10 questions done! Keep going strong!";
        } else if (currentQIndex === 20) {
            msg.innerText = "🚀 Superb! 20 questions complete! Final 10 questions sprint!";
        }
        modal.style.display = "flex";
    }

    function closeEncourageModal() {
        document.getElementById("encourage-modal").style.display = "none";
        loadQuestion();
    }

    function showSummaryModal() {
        const modal = document.getElementById("summary-modal");
        document.getElementById("final-score").innerText = `Your Score: ${score} / 30`;

        const suggestionsContainer = document.getElementById("review-suggestions");
        suggestionsContainer.innerHTML = "<strong>💡 Personalised Revision Advice:</strong><br><br>";

        const wrongTenses = Object.keys(tenseStats);
        if (wrongTenses.length === 0) {
            suggestionsContainer.innerHTML += "<div class='review-card' style='border-color:#2ECC71;'>🏆 Perfect Score! You are a 6B Tenses Master! Outstanding effort!</div>";
        } else {
            wrongTenses.forEach(tense => {
                let tip = "";
                switch(tense) {
                    case "Simple Present Tense": tip = "Review daily habits. Remember singular subjects (He/She/It) take verb + -s/-es."; break;
                    case "Simple Past Tense": tip = "Watch for past keywords (yesterday, last week, ago) and irregular verbs."; break;
                    case "Present Continuous Tense": tip = "Look out for Look!, Listen!, now. Structure: is/am/are + v-ing."; break;
                    case "Future Tense": tip = "Check for future keywords (tomorrow, next week). Use will + base verb."; break;
                    case "Present Perfect Tense": tip = "Look for already, yet, ever, since, for. Use: have/has + p.p."; break;
                    case "Past Continuous Tense": tip = "Use structure: was/were + v-ing (commonly with 'while' / 'when')."; break;
                }
                suggestionsContainer.innerHTML += `<div class='review-card'><strong>${tense} (${tenseStats[tense]} mistake/s):</strong><br>${tip}</div>`;
            });
        }

        modal.style.display = "flex";
    }

    function exportReport() {
        const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        let reportText = `======================================\n`;
        reportText += `       6B TENSE CHALLENGE REPORT      \n`;
        reportText += `======================================\n`;
        reportText += `Date: ${dateStr}\n`;
        reportText += `Final Score: ${score} / 30 (${Math.round((score/30)*100)}%)\n\n`;
        reportText += `PERFORMANCE SUMMARY:\n`;
        
        const wrongTenses = Object.keys(tenseStats);
        if (wrongTenses.length === 0) {
            reportText += `🌟 Perfect! You mastered all 6B Tenses with zero mistakes!\n`;
        } else {
            reportText += `Areas to Revise:\n`;
            wrongTenses.forEach(tense => {
                reportText += `- ${tense}: ${tenseStats[tense]} mistake(s)\n`;
            });
        }
        reportText += `\nKeep practicing daily to stay sharp! 💪\n`;
        reportText += `======================================\n`;

        const blob = new Blob([reportText], { type: 'text/plain' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `6B_Tenses_Report_${dateStr.replace(/ /g, '_')}.txt`;
        link.click();
    }

    function restartGame() {
        initGame();
    }

    window.onload = initGame;
</script>
</body>
</html>
