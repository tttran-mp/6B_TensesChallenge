<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>6B Tenses Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #2A60A0;
            --secondary: #FF6B81;
            --accent: #FFD166;
            --accent-dark: #E0A800;
            --success: #2ECC71;
            --success-dark: #27AE60;
            --danger: #FF4757;
            --danger-dark: #C0392B;
            --bg-pattern: #EBF5FF;
            --card-bg: #FFFFFF;
            --text-main: #2D3436;
        }

        * {
            box-sizing: border-box;
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-pattern);
            background-image: radial-gradient(#BEE3F8 15%, transparent 16%), radial-gradient(#BEE3F8 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: clamp(10px, 3vw, 20px);
        }

        /* 遊戲主容器 RWD 自動縮放 */
        .game-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 680px;
            border-radius: 32px;
            border: 6px solid #BEE3F8;
            box-shadow: 0 12px 0 #90CDF4, 0 20px 30px rgba(0, 0, 0, 0.1);
            padding: clamp(16px, 4vw, 28px);
            position: relative;
            overflow: hidden;
        }

        /* 頂部資訊欄 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .pill-badge {
            background: #EDF2F7;
            border: 3px solid #CBD5E0;
            color: var(--primary-dark);
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: clamp(0.9rem, 2.8vw, 1.15rem);
            box-shadow: 0 4px 0 #CBD5E0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .score-badge {
            background: #FEFCBF;
            border-color: #F6E05E;
            color: #744210;
            box-shadow: 0 4px 0 #F6E05E;
        }

        /* 可愛計時器條 */
        .timer-outer {
            width: 100%;
            height: 18px;
            background: #E2E8F0;
            border-radius: 50px;
            border: 3px solid #CBD5E0;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .timer-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #FFD166, #FF6B81);
            border-radius: 50px;
            transition: width 0.1s linear, background 0.3s;
        }

        /* 題目卡片 */
        .question-box {
            background: #F7FAFC;
            border: 4px dashed #90CDF4;
            border-radius: 24px;
            padding: clamp(20px, 4vw, 30px) clamp(12px, 3vw, 20px);
            margin-bottom: 20px;
            text-align: center;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .question-text {
            font-size: clamp(1.15rem, 3.8vw, 1.45rem);
            line-height: 1.6;
            color: #2D3436;
            font-weight: 600;
        }

        .blank-space {
            display: inline-block;
            min-width: 80px;
            border-bottom: 4px solid var(--primary);
            color: var(--primary);
            padding: 0 8px;
            font-weight: 700;
        }

        /* 選項按鈕區 (自適應 1 欄或 2 欄) */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .option-btn {
            background: #FFFFFF;
            border: 3px solid #E2E8F0;
            border-radius: 20px;
            padding: clamp(12px, 2.5vw, 16px) 18px;
            font-size: clamp(1rem, 3vw, 1.15rem);
            font-weight: 600;
            color: #4A5568;
            cursor: pointer;
            box-shadow: 0 6px 0 #CBD5E0;
            transition: all 0.15s ease;
            text-align: left;
            display: flex;
            align-items: center;
            width: 100%;
            word-break: break-word;
        }

        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: 0 8px 0 #90CDF4;
            color: var(--primary-dark);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #CBD5E0;
        }

        .option-btn.correct {
            background: #D4EDDA !important;
            border-color: var(--success) !important;
            color: #155724 !important;
            box-shadow: 0 6px 0 var(--success-dark) !important;
        }

        .option-btn.wrong {
            background: #F8D7DA !important;
            border-color: var(--danger) !important;
            color: #721C24 !important;
            box-shadow: 0 6px 0 var(--danger-dark) !important;
        }

        /* 答錯解釋盒 */
        .explanation-card {
            background: #FFFBEB;
            border: 3px solid #FCD34D;
            border-radius: 18px;
            padding: 14px 18px;
            margin-bottom: 15px;
            font-size: clamp(0.9rem, 2.6vw, 1.05rem);
            color: #92400E;
            line-height: 1.5;
            display: none;
            box-shadow: 0 4px 0 #FDE68A;
        }

        /* 可愛主按鈕 */
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 14px 28px;
            font-size: clamp(1.1rem, 3vw, 1.25rem);
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 0 var(--primary-dark);
            transition: all 0.15s ease;
            display: none;
        }

        .action-btn:hover {
            background: #357ABD;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--primary-dark);
        }

        /* 彈出層 (Modal) 佈局 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.96);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            border-radius: 26px;
        }

        /* 結算畫面背景 (套用相鄰層級 happy.png) */
        .summary-modal {
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.92)), url('happy.jpg') no-repeat center center;
            background-size: cover;
        }

        .modal-content-box {
            background: #FFFFFF;
            border: 5px solid var(--accent);
            border-radius: 26px;
            padding: clamp(20px, 4vw, 30px);
            box-shadow: 0 10px 0 var(--accent-dark), 0 15px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: clamp(1.5rem, 5vw, 2rem);
            color: var(--primary);
            margin-bottom: 12px;
        }

        .review-container {
            text-align: left;
            margin: 16px 0;
            font-size: clamp(0.88rem, 2.5vw, 1rem);
        }

        .review-card {
            background: #F7FAFC;
            border-left: 5px solid var(--secondary);
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .btn-restart {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 32px;
            font-size: clamp(1.1rem, 3vw, 1.25rem);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--success-dark);
            margin-top: 10px;
            display: inline-block;
        }

        .btn-restart:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--success-dark);
        }

        /* 小螢幕 (Mobile) 特別微調 */
        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .game-card {
                padding: 16px 12px;
                border-width: 4px;
                box-shadow: 0 8px 0 #90CDF4, 0 12px 20px rgba(0, 0, 0, 0.1);
            }
        }
    </style>
</head>
<body>

<div class="game-card">
    <!-- Top Info Bar -->
    <div class="top-bar">
        <div class="pill-badge" id="progress-text">🎯 1 / 30</div>
        <div class="pill-badge score-badge" id="score-text">⭐ 0</div>
    </div>

    <!-- Cute Timer Bar -->
    <div class="timer-outer">
        <div class="timer-inner" id="timer-bar"></div>
    </div>

    <!-- Question Display -->
    <div class="question-box">
        <p class="question-text" id="question-text">Loading...</p>
    </div>

    <!-- Answer Options Grid -->
    <div class="options-grid" id="options-container"></div>

    <!-- Grammar Explanation Box -->
    <div class="explanation-card" id="explanation-box"></div>

    <!-- Next Question Button -->
    <button class="action-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>

    <!-- Encouragement Modal (Every 10 Qs) -->
    <div class="modal-overlay" id="encourage-modal">
        <div class="modal-content-box">
            <h2 class="modal-title" id="encourage-title">🌟 Fantastic Work!</h2>
            <p id="encourage-msg" style="font-size: clamp(1rem, 3vw, 1.2rem); margin: 15px 0; color: #4A5568;">
                You completed 10 questions! Keep up the great energy!
            </p>
            <button class="btn-restart" onclick="closeEncourageModal()">Keep Going 💪</button>
        </div>
    </div>

    <!-- Game Completion Summary Modal -->
    <div class="modal-overlay summary-modal" id="summary-modal">
        <div class="modal-content-box">
            <h2 class="modal-title">🎉 Challenge Complete!</h2>
            <p style="font-size: clamp(1.2rem, 3.5vw, 1.5rem); font-weight: 700; color: #2D3436;" id="final-score">
                Your Score: 0 / 30
            </p>
            
            <div class="review-container" id="review-suggestions"></div>

            <button class="btn-restart" onclick="restartGame()">Play Again 🔄</button>
        </div>
    </div>
</div>

<script>
    // Web Audio API Sound Effects
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // Question Bank (30 Primary 6 Tenses Questions)
    const questionBank = [
        { text: "Mum <span class='blank-space'></span> to work on Mondays.", options: ["works", "is working", "was working", "worked"], answer: 0, tense: "Simple Present Tense", hint: "'on Mondays' indicates a regular habit. Use Simple Present Tense (Mum + verb-s)." },
        { text: "Miss Tran <span class='blank-space'></span> lunch yet.", options: ["has not eaten", "has eaten", "has not ate", "had not eaten"], answer: 0, tense: "Present Perfect Tense", hint: "'yet' is a key signal for Present Perfect Tense (has/have + not + p.p.)." },
        { text: "Look! The children <span class='blank-space'></span> in the playground.", options: ["are playing", "play", "played", "were playing"], answer: 0, tense: "Present Continuous Tense", hint: "'Look!' signals an action taking place now. Use Present Continuous Tense (are + v-ing)." },
        { text: "We <span class='blank-space'></span> Japan two years ago.", options: ["visited", "have visited", "visit", "were visiting"], answer: 0, tense: "Simple Past Tense", hint: "'two years ago' refers to a specific finished past time. Use Simple Past Tense." },
        { text: "They <span class='blank-space'></span> a picnic next Sunday if it is sunny.", options: ["will have", "had", "have had", "were having"], answer: 0, tense: "Future Tense", hint: "'next Sunday' signals a future plan. Use Future Tense (will + base verb)." },
        { text: "While Mary was reading, the phone <span class='blank-space'></span>.", options: ["rang", "was ringing", "rings", "has rung"], answer: 0, tense: "Past Continuous Tense", hint: "An action that interrupts a past continuous action takes Simple Past Tense (rang)." },
        { text: "Peter <span class='blank-space'></span> his keys in the park yesterday morning.", options: ["lost", "has lost", "loses", "is losing"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday morning' is a past time indicator. The past tense of 'lose' is 'lost'." },
        { text: "I <span class='blank-space'></span> in Hong Kong since 2018.", options: ["have lived", "lived", "am living", "will live"], answer: 0, tense: "Present Perfect Tense", hint: "'since + point in time' shows an action continuing from past to present (have lived)." },
        { text: "Listen! Someone <span class='blank-space'></span> the piano upstairs.", options: ["is playing", "plays", "played", "has played"], answer: 0, tense: "Present Continuous Tense", hint: "'Listen!' signals an ongoing current action. Use Present Continuous Tense (is playing)." },
        { text: "My father usually <span class='blank-space'></span> coffee in the morning.", options: ["drinks", "is drinking", "drank", "has drunk"], answer: 0, tense: "Simple Present Tense", hint: "'usually' expresses a daily habit. Use Simple Present Tense (drinks)." },
        { text: "What <span class='blank-space'></span> you doing at 8 p.m. last night?", options: ["were", "are", "have been", "did"], answer: 0, tense: "Past Continuous Tense", hint: "Asking about an action in progress at a specific past time: 'Were you doing...?'" },
        { text: "We <span class='blank-space'></span> the new museum tomorrow morning.", options: ["will visit", "visited", "have visited", "visit"], answer: 0, tense: "Future Tense", hint: "'tomorrow morning' indicates a future action. Use Future Tense (will visit)." },
        { text: "Tom <span class='blank-space'></span> already finished his homework.", options: ["has", "is", "was", "did"], answer: 0, tense: "Present Perfect Tense", hint: "'already' pairs with Present Perfect Tense. Singular subject 'Tom' takes 'has'." },
        { text: "They <span class='blank-space'></span> to the beach last Saturday.", options: ["went", "go", "have gone", "are going"], answer: 0, tense: "Simple Past Tense", hint: "'last Saturday' specifies past time. The past tense of 'go' is 'went'." },
        { text: "Be quiet! The baby <span class='blank-space'></span> in the bedroom.", options: ["is sleeping", "sleeps", "slept", "has slept"], answer: 0, tense: "Present Continuous Tense", hint: "'Be quiet!' warns about a happening now. Use Present Continuous Tense (is sleeping)." },
        { text: "Uncle Ray <span class='blank-space'></span> to London next week.", options: ["will fly", "flew", "has flown", "was flying"], answer: 0, tense: "Future Tense", hint: "'next week' refers to the future. Use Future Tense (will fly)." },
        { text: "She <span class='blank-space'></span> TV when her friend called her.", options: ["was watching", "watched", "is watching", "has watched"], answer: 0, tense: "Past Continuous Tense", hint: "An action in progress in the past (was watching) interrupted by another action (called)." },
        { text: "David never <span class='blank-space'></span> fast food because he prefers healthy meals.", options: ["eats", "is eating", "ate", "has eaten"], answer: 0, tense: "Simple Present Tense", hint: "'never' states a general truth/habit. Use Simple Present Tense (eats)." },
        { text: "Have you ever <span class='blank-space'></span> a panda in real life?", options: ["seen", "saw", "see", "seeing"], answer: 0, tense: "Present Perfect Tense", hint: "'Have you ever...' takes a Past Participle (p.p.). The p.p. of 'see' is 'seen'." },
        { text: "The rain stopped while we <span class='blank-space'></span> under the tree.", options: ["were waiting", "waited", "are waiting", "have waited"], answer: 0, tense: "Past Continuous Tense", hint: "After 'while', use Past Continuous Tense for the background action (were waiting)." },
        { text: "My sister <span class='blank-space'></span> a letter right now.", options: ["is writing", "writes", "wrote", "has written"], answer: 0, tense: "Present Continuous Tense", hint: "'right now' shows an action happening at this exact moment (is writing)." },
        { text: "Mr. Chan <span class='blank-space'></span> English in this school for ten years.", options: ["has taught", "taught", "teaches", "is teaching"], answer: 0, tense: "Present Perfect Tense", hint: "'for + period of time' shows action extending to present. Use Present Perfect (has taught)." },
        { text: "I <span class='blank-space'></span> my grandfather in the hospital yesterday.", options: ["visited", "have visited", "visit", "will visit"], answer: 0, tense: "Simple Past Tense", hint: "'yesterday' indicates past time. Use Simple Past Tense (visited)." },
        { text: "We <span class='blank-space'></span> our final examinations next month.", options: ["will take", "took", "have taken", "were taking"], answer: 0, tense: "Future Tense", hint: "'next month' indicates future time. Use Future Tense (will take)." },
        { text: "Water <span class='blank-space'></span> at 100 degrees Celsius.", options: ["boils", "is boiling", "boiled", "will boil"], answer: 0, tense: "Simple Present Tense", hint: "Scientific facts use Simple Present Tense (boils)." },
        { text: "The cat ran away while the dog <span class='blank-space'></span>.", options: ["was barking", "barked", "is barking", "has barked"], answer: 0, tense: "Past Continuous Tense", hint: "Use Past Continuous Tense after 'while' for an action in progress (was barking)." },
        { text: "Grandma <span class='blank-space'></span> her glasses. She cannot read now.", options: ["has lost", "lost", "loses", "was losing"], answer: 0, tense: "Present Perfect Tense", hint: "A past event with a result in the present (cannot read now) uses Present Perfect Tense." },
        { text: "Tim <span class='blank-space'></span> a new bicycle next Friday.", options: ["will buy", "bought", "has bought", "was buying"], answer: 0, tense: "Future Tense", hint: "'next Friday' specifies a future time. Use Future Tense (will buy)." },
        { text: "The students <span class='blank-space'></span> noisy when the teacher arrived.", options: ["were", "are", "have been", "will be"], answer: 0, tense: "Simple Past Tense", hint: "'when the teacher arrived' describes a past situation. Use 'were'." },
        { text: "Sam always <span class='blank-space'></span> his teeth before going to bed.", options: ["brushes", "is brushing", "brushed", "has brushed"], answer: 0, tense: "Simple Present Tense", hint: "'always' specifies a habit. Singular subject 'Sam' takes 'brushes'." }
    ];

    let currentQIndex = 0;
    let score = 0;
    let timer = null;
    let timeLeft = 10;
    let tenseStats = {};

    function initGame() {
        currentQIndex = 0;
        score = 0;
        tenseStats = {};
        document.getElementById("summary-modal").style.display = "none";
        document.getElementById("encourage-modal").style.display = "none";
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questionBank[currentQIndex];

        document.getElementById("progress-text").innerText = `🎯 Question ${currentQIndex + 1} / 30`;
        document.getElementById("score-text").innerText = `⭐ ${score}`;
        document.getElementById("question-text").innerHTML = q.text;

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        let optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, isCorrect: idx === q.answer }));
        optionsWithIndex.sort(() => Math.random() - 0.5);

        optionsWithIndex.forEach(optObj => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = optObj.text;
            btn.onclick = () => selectAnswer(btn, optObj.isCorrect, q);
            optionsContainer.appendChild(btn);
        });

        startTimer();
    }

    function resetState() {
        clearInterval(timer);
        timeLeft = 10;
        updateTimerBar();
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(timer);
                handleTimeout();
            }
            updateTimerBar();
        }, 100);
    }

    function updateTimerBar() {
        const percentage = (timeLeft / 10) * 100;
        const bar = document.getElementById("timer-bar");
        bar.style.width = percentage + "%";
        if (timeLeft < 3) {
            bar.style.background = "#FF4757";
        } else {
            bar.style.background = "linear-gradient(90deg, #FFD166, #FF6B81)";
        }
    }

    function selectAnswer(selectedBtn, isCorrect, q) {
        clearInterval(timer);
        disableOptions();

        if (isCorrect) {
            playSound('correct');
            selectedBtn.classList.add("correct");
            score++;
            document.getElementById("score-text").innerText = `⭐ ${score}`;
            showNextStep();
        } else {
            playSound('wrong');
            selectedBtn.classList.add("wrong");
            recordWrongTense(q.tense);
            showExplanation(q);
            highlightCorrectOption(q);
        }
    }

    function handleTimeout() {
        disableOptions();
        playSound('wrong');
        const q = questionBank[currentQIndex];
        recordWrongTense(q.tense);
        showExplanation(q, "⏰ Time's Up!");
        highlightCorrectOption(q);
    }

    function recordWrongTense(tense) {
        tenseStats[tense] = (tenseStats[tense] || 0) + 1;
    }

    function highlightCorrectOption(q) {
        const correctText = q.options[q.answer];
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => {
            if (btn.innerText === correctText) {
                btn.classList.add("correct");
            }
        });
    }

    function disableOptions() {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
    }

    function showExplanation(q, prefix = "") {
        const expBox = document.getElementById("explanation-box");
        expBox.innerHTML = `<strong>${prefix} Grammar Tip (${q.tense}):</strong><br>${q.hint}`;
        expBox.style.display = "block";
        showNextStep();
    }

    function showNextStep() {
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQIndex++;
        
        if (currentQIndex === 10 || currentQIndex === 20) {
            showEncourageModal();
            return;
        }

        if (currentQIndex < questionBank.length) {
            loadQuestion();
        } else {
            showSummaryModal();
        }
    }

    function showEncourageModal() {
        const modal = document.getElementById("encourage-modal");
        const msg = document.getElementById("encourage-msg");
        if (currentQIndex === 10) {
            msg.innerText = "🌟 Great job! You have completed the first 10 questions! Keep up the momentum!";
        } else if (currentQIndex === 20) {
            msg.innerText = "🚀 Awesome! 20 questions done! Final 10 questions to go!";
        }
        modal.style.display = "flex";
    }

    function closeEncourageModal() {
        document.getElementById("encourage-modal").style.display = "none";
        loadQuestion();
    }

    function showSummaryModal() {
        const modal = document.getElementById("summary-modal");
        document.getElementById("final-score").innerText = `Your Score: ${score} / 30`;

        const suggestionsContainer = document.getElementById("review-suggestions");
        suggestionsContainer.innerHTML = "<strong>💡 Personalised Revision Advice:</strong><br><br>";

        const wrongTenses = Object.keys(tenseStats);
        if (wrongTenses.length === 0) {
            suggestionsContainer.innerHTML += "<div class='review-card' style='border-color:#2ECC71;'>🏆 Perfect Score! You have mastered all 6B English tenses! Outstanding effort!</div>";
        } else {
            wrongTenses.forEach(tense => {
                let tip = "";
                switch(tense) {
                    case "Simple Present Tense":
                        tip = "Review daily habits and facts. Remember singular subjects (He/She/It) need verb + -s/-es.";
                        break;
                    case "Simple Past Tense":
                        tip = "Watch for past keywords (yesterday, last week, ago) and memorize irregular verbs.";
                        break;
                    case "Present Continuous Tense":
                        tip = "Look out for Look!, Listen!, and now. Use structure: is/am/are + v-ing.";
                        break;
                    case "Future Tense":
                        tip = "Check for future keywords (tomorrow, next week). Use will / be going to + base verb.";
                        break;
                    case "Present Perfect Tense":
                        tip = "Identify keywords like already, yet, ever, since, for. Use: have/has + past participle (p.p.).";
                        break;
                    case "Past Continuous Tense":
                        tip = "Use structure: was/were + v-ing. Common in sentence patterns with 'while' or 'when'.";
                        break;
                }
                suggestionsContainer.innerHTML += `<div class='review-card'><strong>${tense} (${tenseStats[tense]} mistakes):</strong><br>${tip}</div>`;
            });
        }

        modal.style.display = "flex";
    }

    function restartGame() {
        initGame();
    }

    window.onload = initGame;
</script>
</body>
</html>
